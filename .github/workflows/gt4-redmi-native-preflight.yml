name: GT4 Android native-build preflight (source only)

on:
  push:
    branches: [task/215-redmi-gt4-native-boot]
    paths:
      - tools/redmi_boot_preflight.py
      - android/redmi-native.cmd
      - android/REDMI-REAL-GAME-BOOT.md
      - .github/workflows/gt4-redmi-native-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate offline preflight code without any game data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax, help, and expected missing-local-input gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/redmi_boot_preflight.py
          python3 tools/redmi_boot_preflight.py --help > /dev/null
          set +e
          python3 tools/redmi_boot_preflight.py > "$RUNNER_TEMP/redmi-readiness.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/redmi-readiness.txt"
          test "$code" -eq 2
          grep -F "[FALTA]" "$RUNNER_TEMP/redmi-readiness.txt" > /dev/null
          grep -F "BLOQUEADO" "$RUNNER_TEMP/redmi-readiness.txt" > /dev/null
          echo "OFFLINE_BOOT_PREFLIGHT_PASS"
      - name: Confirm no prohibited game input has been generated by test
        shell: bash
        run: |
          set -euo pipefail
          test ! -d private
          test ! -f libgt4.so
          test ! -f gt4.iso
