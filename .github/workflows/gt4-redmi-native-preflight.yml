name: GT4 Android native-build preflight (source only)

on:
  push:
    branches: [task/215-redmi-gt4-native-boot]
    paths:
      - tools/redmi_boot_preflight.py
      - tools/verify_public_runtime_capsules.py
      - tests/python/test_redmi_boot_preflight.py
      - android/redmi-native.cmd
      - android/native/configure-android.cmd
      - android/redmi-local-assets.ps1
      - android/verificar-arquivos-gt4.cmd
      - android/integrar-ee-vu-privado.cmd
      - android/EE-VU-PRIVADO-INTEGRACAO.md
      - tests/powershell/Test-RedmiLocalAssets.ps1
      - android/REDMI-REAL-GAME-BOOT.md
      - .github/workflows/gt4-redmi-native-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate offline preflight code without any game data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax, help, and expected missing-local-input gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/redmi_boot_preflight.py
          python3 tests/python/test_redmi_boot_preflight.py -v
          python3 tools/redmi_boot_preflight.py --help > /dev/null
          set +e
          python3 tools/redmi_boot_preflight.py > "$RUNNER_TEMP/redmi-readiness.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/redmi-readiness.txt"
          test "$code" -eq 2
          grep -F "[FALTA]" "$RUNNER_TEMP/redmi-readiness.txt" > /dev/null
          grep -F "BLOQUEADO" "$RUNNER_TEMP/redmi-readiness.txt" > /dev/null
          set +e
          python3 tools/redmi_boot_preflight.py --apk-tools \
            > "$RUNNER_TEMP/redmi-apk-readiness.txt"
          apk_code=$?
          python3 tools/redmi_boot_preflight.py --staged \
            > "$RUNNER_TEMP/redmi-staged-readiness.txt"
          staged_code=$?
          set -e
          test "$apk_code" -eq 2
          test "$staged_code" -eq 2
          grep -F "Assinatura APK privada" "$RUNNER_TEMP/redmi-apk-readiness.txt" >/dev/null
          grep -F "[FALTA]" "$RUNNER_TEMP/redmi-staged-readiness.txt" >/dev/null
          echo "OFFLINE_BOOT_PREFLIGHT_PASS"
      - name: Audit manual Android build path (no game assets or device actions)
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'USE_VULKAN=OFF' android/redmi-native.cmd
          grep -F '"-DGT4_EE_UNITS_DIR=%GT4_EE_UNITS_DIR%"' android/native/configure-android.cmd
          grep -F '"-DGT4_EE_UNITS_MANIFEST=%GT4_EE_UNITS_MANIFEST%"' android/native/configure-android.cmd
          grep -F '"-DGT4_VU0_GENERATED_DIR=%GT4_VU0_GENERATED_DIR%"' android/native/configure-android.cmd
          grep -F '"-DGT4_VU1_GENERATED_DIR=%GT4_VU1_GENERATED_DIR%"' android/native/configure-android.cmd
          grep -F 'USE_OPENGL=ON' android/redmi-native.cmd
          grep -F 'android\stage-native-libs.cmd' android/redmi-native.cmd
          grep -F 'android\stage-armsx2gs.cmd' android/redmi-native.cmd
          grep -F 'cargo tauri android build --target aarch64 --apk --ci' android/redmi-native.cmd
          if grep -Ei '^[[:space:]]*(call[[:space:]]+)?(adb|git[[:space:]]+push|curl)[[:space:]]' \
            android/redmi-native.cmd; then
            echo "Unexpected device or upload command in build script" >&2
            exit 1
          fi
          echo "REDMI_REAL_GAME_BUILD_PATH_AUDITED"
      - name: Confirm no prohibited game input has been generated by test
        shell: bash
        run: |
          set -euo pipefail
          test ! -d private
          test ! -f libgt4.so
          test ! -f gt4.iso

  windows-gate:
    name: Validate Windows CMD blocks missing-private game builds
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate local EE/VU files are recognized without inspecting content
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\powershell\Test-RedmiLocalAssets.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Existing-local-assets fixture check failed"
          }
      - name: Verify local EE/VU integration rejects missing private archive
        shell: pwsh
        run: |
          & cmd.exe /d /c 'android\integrar-ee-vu-privado.cmd "Z:\GT4_MISSING_PRIVATE_INPUTS" --check'
          if ($LASTEXITCODE -ne 2) {
            throw "Expected incomplete private package to stop (2), got $LASTEXITCODE"
          }
          Write-Host "EE_VU_PRIVATE_PACKAGE_GATE_PASS"
          exit 0
      - name: Check that the real-game batch script fails closed
        shell: pwsh
        run: |
          & cmd.exe /d /c "android\redmi-native.cmd --check"
          $check = $LASTEXITCODE
          if ($check -ne 2) {
            throw "Expected --check to block without private inputs (2), got $check"
          }
          & cmd.exe /d /c "android\redmi-native.cmd --build-apk"
          $build = $LASTEXITCODE
          if ($build -ne 2) {
            throw "Expected --build-apk to block without private inputs (2), got $build"
          }
          Write-Host "WINDOWS_REAL_GAME_PRIVATE_GATE_PASS"
          # GitHub pwsh propagates the previous expected native exit code
          # unless we explicitly end the validating script successfully.
          exit 0

  public-runtime:
    name: Regenerate public donor PS2 runtime and verify exact SHA-256 pins
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout clean pinned MIT PS2 donor without game data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private/references/ps2-web-recomp
          git -C private/references/ps2-web-recomp init -q
          git -C private/references/ps2-web-recomp remote add origin https://github.com/snuri00/ps2-web-recomp.git
          git -C private/references/ps2-web-recomp fetch --filter=blob:none --depth=1 origin 1b4808793a12c45125262fd2d5f50a9ec9f7c020
          git -C private/references/ps2-web-recomp checkout -q --detach FETCH_HEAD
          test "$(git -C private/references/ps2-web-recomp rev-parse HEAD)" = "1b4808793a12c45125262fd2d5f50a9ec9f7c020"
          test -z "$(git -C private/references/ps2-web-recomp status --porcelain --untracked-files=all)"
      - name: Derive runtime components and verify immutable source and receipt pins
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/verify_public_runtime_capsules.py
          python3 tools/verify_public_runtime_capsules.py
      - name: Reject game-derived inputs and binary artifact publication
        shell: bash
        run: |
          set -euo pipefail
          test ! -f private/SCUS_973.28.elf
          test ! -f private/gt4.iso
          test ! -f libgt4.so
          echo "ONLY_PUBLIC_RUNTIME_PINNED_SOURCES_VALIDATED"
